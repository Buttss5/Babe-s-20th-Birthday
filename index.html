<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy 20th Birthday, Love
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#fbf3ef;
    --paper:#fffbf8;
    --blush:#f3d7dd;
    --rose:#c97a95;
    --rose-deep:#9c4863;
    --plum:#4a2436;
    --gold:#c8a15f;
    --gold-soft:#e6cd9a;
    --line:rgba(74,36,54,.14);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;
    background:var(--ivory);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(201,122,149,.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(201,122,149,.10), transparent 45%);
    color:var(--plum);
    font-family:'Karla',sans-serif;
    overflow-x:hidden;
  }
  h1,h2{
    font-family:'Cormorant Garamond',serif;
    font-weight:500;
    margin:0;
    color:var(--rose-deep);
  }
  :focus-visible{ outline:2px solid var(--rose-deep); outline-offset:3px; }

  /* ---------- ambient petals ---------- */
  #petal-field{
    position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:1;
  }
  .petal{
    position:absolute; top:-30px;
    width:9px; height:9px;
    background:var(--rose);
    border-radius:0 70% 0 70%;
    opacity:.35;
    animation:fall linear infinite;
  }
  @keyframes fall{
    to{ transform:translateY(112vh) translateX(var(--drift,0px)) rotate(300deg); }
  }

  section{
    position:relative; z-index:2;
    padding:7rem 1.5rem;
    max-width:880px;
    margin:0 auto;
  }

  /* ---------- flourish divider ---------- */
  .flourish{ display:flex; justify-content:center; margin:0 0 1.4rem; opacity:.8; }
  .flourish svg{ width:120px; height:22px; }

  /* ---------- hero ---------- */
  .hero{
    min-height:100svh;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    opacity:0;
    animation:reveal 1.4s ease forwards .2s;
  }
  @keyframes reveal{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .hero .ornament{ width:64px; height:64px; margin-bottom:1.6rem; color:var(--gold); }
  .hero h1{
    font-size:clamp(3rem,9vw,5.4rem);
    line-height:1;
    letter-spacing:.01em;
  }
  .hero .name{
    display:block;
    font-style:italic;
    font-size:clamp(1.6rem,4.4vw,2.2rem);
    color:var(--rose);
    margin-top:.9rem;
    letter-spacing:.04em;
  }
  .scroll-cue{
    margin-top:4rem; width:1px; height:52px;
    background:linear-gradient(var(--rose-deep),transparent);
    position:relative;
  }

  /* ---------- section labels (minimal) ---------- */
  .label{
    text-align:center;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:1.5rem;
    color:var(--rose-deep);
    margin-bottom:2.6rem;
  }

  /* ---------- gallery ---------- */
  .polaroids{
    display:flex; flex-wrap:wrap; justify-content:center;
    gap:2rem 1.6rem;
  }
  .polaroid{
    background:var(--paper);
    padding:.8rem .8rem 1.1rem;
    width:180px;
    border-radius:2px;
    box-shadow:0 18px 34px -12px rgba(74,36,54,.28), 0 0 0 1px rgba(255,255,255,.6) inset;
    transition:transform .4s ease, box-shadow .4s ease;
  }
  .polaroid:nth-child(odd){ transform:rotate(-3.5deg); }
  .polaroid:nth-child(even){ transform:rotate(2.5deg); }
  .polaroid:nth-child(3n){ transform:rotate(-1.5deg); }
  .polaroid:hover{ transform:translateY(-8px) rotate(0deg); box-shadow:0 26px 40px -12px rgba(74,36,54,.32); }
  .frame{
    position:relative; width:100%; aspect-ratio:1/1.08;
    background:linear-gradient(150deg,var(--blush),#f6c9d5);
    overflow:hidden;
    display:flex; align-items:center; justify-content:center;
  }
  .frame img{ width:100%; height:100%; object-fit:cover; display:block; }
  .frame .plus{
    width:30px; height:30px; color:var(--rose-deep); opacity:.55;
  }
  .frame input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .caption{
    display:block; margin-top:.65rem; text-align:center;
    font-family:'Cormorant Garamond',serif; font-style:italic; font-size:.98rem;
    color:var(--plum); border:none; background:transparent; width:100%;
  }
  .caption:focus{ outline:none; border-bottom:1px solid var(--rose); }

  /* ---------- letter ---------- */
  .letter-wrap{ display:flex; justify-content:center; }
  .envelope{ width:min(100%,520px); cursor:pointer; }
  .envelope-face{
    position:relative;
    background:linear-gradient(180deg,var(--paper),var(--blush));
    border:1px solid var(--line);
    border-radius:6px;
    padding:3.2rem 1.5rem;
    text-align:center;
    box-shadow:0 24px 50px -18px rgba(74,36,54,.35);
    transition:transform .35s ease;
  }
  .envelope-face:hover{ transform:translateY(-3px); }
  .seal{
    width:56px; height:56px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold));
    display:flex; align-items:center; justify-content:center;
    margin:0 auto 1.2rem;
    box-shadow:0 8px 18px rgba(200,161,95,.45);
    color:#fff; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:1.4rem;
  }
  .envelope-face .cue{
    font-family:'Cormorant Garamond',serif; font-style:italic; color:var(--rose-deep); font-size:1.1rem;
  }

  .letter-paper{
    display:none;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:3rem 2.2rem;
    margin-top:1.6rem;
    box-shadow:0 24px 50px -18px rgba(74,36,54,.3);
    position:relative;
  }
  .letter-paper::before{
    content:"";
    position:absolute; inset:10px;
    border:1px solid rgba(200,161,95,.35);
    pointer-events:none;
  }
  .letter-paper.open{ display:block; animation:unfold .55s ease; }
  @keyframes unfold{
    from{ opacity:0; transform:translateY(-10px) scaleY(.97); transform-origin:top; }
    to{ opacity:1; transform:translateY(0) scaleY(1); }
  }
  .letter-paper p{
    margin:0 0 1.15rem;
    line-height:1.85;
    font-size:1.06rem;
  }
  .letter-paper p:first-of-type::first-letter{
    font-family:'Cormorant Garamond',serif;
    font-size:3rem;
    color:var(--rose-deep);
    float:left;
    line-height:.8;
    margin:.1rem .35rem 0 0;
  }
  .letter-paper p:last-of-type{ margin-bottom:0; }
  .signoff{
    margin-top:1.8rem; text-align:right;
    font-family:'Cormorant Garamond',serif; font-style:italic;
    color:var(--rose); font-size:1.3rem;
  }

  /* ---------- wish ---------- */
  .wish-scene{
    display:flex; flex-direction:column; align-items:center;
  }
  #candle-btn{
    background:none; border:none; cursor:pointer; padding:.5rem;
  }
  #candle-btn svg{ width:70px; height:130px; }
  .flame{
    animation:flicker 2.4s ease-in-out infinite;
    transform-origin:50% 100%;
  }
  @keyframes flicker{
    0%,100%{ transform:scale(1) rotate(0deg); }
    30%{ transform:scale(1.05,.95) rotate(-2deg); }
    60%{ transform:scale(.95,1.05) rotate(2deg); }
  }
  .smoke{
    opacity:0;
  }
  .blown .flame{ animation:none; opacity:0; transition:opacity .3s ease; }
  .blown .smoke{
    opacity:.5;
    animation:drift 1.8s ease-out forwards;
  }
  @keyframes drift{
    0%{ opacity:.6; transform:translateY(0) scale(1); }
    100%{ opacity:0; transform:translateY(-40px) scale(1.6); }
  }
  .wish-cue{
    margin-top:1.2rem;
    font-family:'Cormorant Garamond',serif; font-style:italic;
    color:var(--rose-deep); font-size:1.1rem;
  }
  .wish-form{
    display:none;
    width:100%; max-width:440px;
    margin-top:1.6rem;
    flex-direction:column; align-items:center;
    gap:1rem;
  }
  .wish-form.show{ display:flex; animation:unfold .5s ease; }
  .wish-form textarea{
    width:100%;
    min-height:110px;
    resize:vertical;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:1rem 1.1rem;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:1.1rem;
    color:var(--plum);
    box-shadow:0 18px 34px -18px rgba(74,36,54,.3);
  }
  .wish-form textarea:focus{ outline:1px solid var(--rose-deep); }
  #keep-wish-btn{
    background:transparent;
    color:var(--rose-deep);
    border:1px solid var(--rose-deep);
    padding:.6rem 2rem;
    border-radius:40px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:1rem;
    cursor:pointer;
    transition:all .3s ease;
  }
  #keep-wish-btn:hover{ background:var(--rose-deep); color:#fff; }
  .wish-kept{
    display:none;
    max-width:460px;
    margin-top:1.8rem;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:6px;
    padding:2rem 1.8rem;
    text-align:center;
    box-shadow:0 20px 40px -18px rgba(74,36,54,.3);
    position:relative;
  }
  .wish-kept.show{ display:block; animation:unfold .5s ease; }
  .wish-kept::before{
    content:"";
    position:absolute; inset:8px;
    border:1px solid rgba(200,161,95,.35);
    pointer-events:none;
  }
  .wish-kept p{
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:1.2rem; line-height:1.7; margin:0 0 .8rem;
    white-space:pre-wrap;
  }
  .wish-kept span{
    font-size:.9rem; color:var(--rose); opacity:.8; font-family:'Karla',sans-serif; font-style:normal;
  }

  /* ---------- closer ---------- */
  .closer{ text-align:center; padding-bottom:9rem; }
  #flower-btn{ background:none; border:none; cursor:pointer; padding:1rem; }
  #flower-btn svg{ width:110px; height:110px; transition:transform .5s ease; }
  #flower-btn:hover svg{ transform:scale(1.06) rotate(4deg); }
  .petal-shape{ transition:transform .6s cubic-bezier(.2,.9,.3,1); transform-origin:60px 60px; }
  .bloomed .petal-shape{ transform:scale(1.4); }

  #celebrate-btn{
    margin-top:1.8rem;
    background:transparent;
    color:var(--rose-deep);
    border:1px solid var(--rose-deep);
    padding:.75rem 2.4rem;
    border-radius:40px;
    font-family:'Cormorant Garamond',serif;
    font-style:italic;
    font-size:1.1rem;
    cursor:pointer;
    transition:all .3s ease;
  }
  #celebrate-btn:hover{ background:var(--rose-deep); color:#fff; }

  footer{
    text-align:center; padding:2rem 1rem 3rem;
    font-family:'Cormorant Garamond',serif; font-style:italic;
    font-size:.95rem; color:var(--rose); opacity:.7;
    position:relative; z-index:2;
  }

  .heart-pop{
    position:fixed; font-size:1rem; color:var(--rose-deep);
    pointer-events:none; z-index:5;
    animation:pop 1.8s ease-out forwards;
  }
  @keyframes pop{
    0%{ transform:translateY(0) scale(.6); opacity:1; }
    80%{ opacity:1; }
    100%{ transform:translateY(-170px) scale(1.05); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior:auto; }
    .petal,.heart-pop,.hero,#flower-btn svg,.polaroid,.envelope-face{ animation:none !important; transition:none !important; }
    .hero{ opacity:1; }
  }

  @media (max-width:480px){
    section{ padding:5rem 1.2rem; }
    .polaroid{ width:145px; }
    .letter-paper{ padding:2.2rem 1.4rem; }
  }
</style>
</head>
<body>

<div id="petal-field" aria-hidden="true"></div>

<section class="hero">
  <svg class="ornament" viewBox="0 0 64 64" fill="none" aria-hidden="true">
    <path d="M32 4c6 8 6 16 0 24-6-8-6-16 0-24z" stroke="currentColor" stroke-width="1.2"/>
    <path d="M6 32c8-6 16-6 24 0-8 6-16 6-24 0z" stroke="currentColor" stroke-width="1.2"/>
    <path d="M58 32c-8-6-16-6-24 0 8 6 16 6 24 0z" stroke="currentColor" stroke-width="1.2"/>
    <circle cx="32" cy="32" r="4" stroke="currentColor" stroke-width="1.2"/>
  </svg>
  <h1>Happy Birthday<span class="name">Anjolina</span></h1>
  <div class="scroll-cue"></div>
</section>

<section id="gallery">
  <div class="flourish"><svg viewBox="0 0 120 22"><path d="M0 11h40M80 11h40" stroke="#c8a15f" stroke-width="1"/><circle cx="60" cy="11" r="4" fill="none" stroke="#c8a15f" stroke-width="1"/></svg></div>
  <p class="label">Gallery</p>
  <div class="polaroids">
    <div class="polaroid">
      <div class="frame">
        <svg class="plus" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="file" accept="image/*" aria-label="Upload photo">
      </div>
      <input class="caption" value="us, somewhere good" aria-label="caption">
    </div>
    <div class="polaroid">
      <div class="frame">
        <svg class="plus" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="file" accept="image/*" aria-label="Upload photo">
      </div>
      <input class="caption" value="that one good day" aria-label="caption">
    </div>
    <div class="polaroid">
      <div class="frame">
        <svg class="plus" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="file" accept="image/*" aria-label="Upload photo">
      </div>
      <input class="caption" value="you, laughing" aria-label="caption">
    </div>
    <div class="polaroid">
      <div class="frame">
        <svg class="plus" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="file" accept="image/*" aria-label="Upload photo">
      </div>
      <input class="caption" value="church day" aria-label="caption">
    </div>
    <div class="polaroid">
      <div class="frame">
        <svg class="plus" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="file" accept="image/*" aria-label="Upload photo">
      </div>
      <input class="caption" value="just us two" aria-label="caption">
    </div>
    <div class="polaroid">
      <div class="frame">
        <svg class="plus" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        <input type="file" accept="image/*" aria-label="Upload photo">
      </div>
      <input class="caption" value="my favorite person" aria-label="caption">
    </div>
  </div>
</section>

<section id="letter">
  <div class="flourish"><svg viewBox="0 0 120 22"><path d="M0 11h40M80 11h40" stroke="#c8a15f" stroke-width="1"/><circle cx="60" cy="11" r="4" fill="none" stroke="#c8a15f" stroke-width="1"/></svg></div>
  <p class="label">For You</p>
  <div class="letter-wrap">
    <div class="envelope" id="envelope" role="button" tabindex="0" aria-expanded="false" aria-controls="letterPaper">
      <div class="envelope-face" id="envelopeFace">
        <div class="seal">A</div>
        <p class="cue">open</p>
      </div>
      <div class="letter-paper" id="letterPaper">
        <p>Hi babe, happy, happy birthday! Another year, another life, another year of challenges you'll face — and those challenges are lessons meant to make you stronger and more confident. Today isn't just an ordinary day, because today is special for you: you've reached two decades on this earth, and that is a big achievement.</p>
        <p>Continue to serve the Lord, continue to be a leader in church, so that more blessings from God will keep being given to you.</p>
        <p>I just want to say I'm thankful to have you in my life. Without you, my life would feel worthless — that's why I'm so grateful you came into it. I'm sorry for the times I acted foolishly, I'm sorry for the times I made you cry, and I'm sorry that I ever gave you a reason to doubt me. I'm not perfect, and I'm not the best, and I've always worried that you might meet someone better who could treat you the way you deserve.</p>
        <p>Still, I'm so grateful to you, because you're the one who helped me through my finances, my studies, and so much more. Thank you for always being by my side, even on our bad days. Thank you for your understanding, babe.</p>
        <p>Lastly, I wish you good health, a mind full of knowledge in your studies, and happiness with your family. Stay pretty, stay healthy, and of course, stay with me.</p>
        <p>Happy 20th birthday, baby! I love you so much.</p>
        <div class="signoff">always yours, 🩷</div>
      </div>
    </div>
  </div>
</section>

<section id="wish">
  <div class="flourish"><svg viewBox="0 0 120 22"><path d="M0 11h40M80 11h40" stroke="#c8a15f" stroke-width="1"/><circle cx="60" cy="11" r="4" fill="none" stroke="#c8a15f" stroke-width="1"/></svg></div>
  <p class="label">Make A Wish</p>
  <div class="wish-scene">
    <button id="candle-btn" aria-label="blow the candle">
      <svg viewBox="0 0 70 130" fill="none">
        <g class="flame">
          <path d="M35 8c-8 10-10 18-6 25 2 4 6 6 6 6s4-2 6-6c4-7 2-15-6-25z" fill="#e8b96b"/>
          <path d="M35 20c-4 6-5 10-3 14 1 2 3 3 3 3s2-1 3-3c2-4 1-8-3-14z" fill="#f6dca0"/>
        </g>
        <g class="smoke">
          <path d="M35 6c2-4 -2-6 0-10" stroke="#c9b8ae" stroke-width="2" stroke-linecap="round"/>
        </g>
        <rect x="27" y="38" width="16" height="80" rx="3" fill="#f3d7dd"/>
        <rect x="27" y="38" width="16" height="10" fill="#e6b9c9"/>
        <rect x="30" y="52" width="10" height="4" fill="#c8a15f" opacity=".6"/>
        <rect x="30" y="72" width="10" height="4" fill="#c8a15f" opacity=".6"/>
        <rect x="30" y="92" width="10" height="4" fill="#c8a15f" opacity=".6"/>
      </svg>
    </button>
    <p class="wish-cue" id="wishCue">blow the candle</p>

    <form class="wish-form" id="wishForm">
      <textarea id="wishText" placeholder="write your wish here..." aria-label="your wish"></textarea>
      <button type="submit" id="keep-wish-btn">keep this wish</button>
    </form>

    <div class="wish-kept" id="wishKept">
      <p id="wishKeptText"></p>
      <span>you made a wish on your 20th birthday</span>
    </div>
  </div>
</section>

<section class="closer">
  <button id="flower-btn" aria-label="tap the flower">
    <svg viewBox="0 0 120 120" fill="none">
      <g id="flowerGroup">
        <ellipse class="petal-shape" cx="60" cy="30" rx="15" ry="23" fill="#e6b9c9"/>
        <ellipse class="petal-shape" cx="60" cy="90" rx="15" ry="23" fill="#e6b9c9"/>
        <ellipse class="petal-shape" cx="30" cy="60" rx="23" ry="15" fill="#f0cfda"/>
        <ellipse class="petal-shape" cx="90" cy="60" rx="23" ry="15" fill="#f0cfda"/>
        <ellipse class="petal-shape" cx="39" cy="39" rx="17" ry="13" fill="#dba4b9" transform="rotate(-45 39 39)"/>
        <ellipse class="petal-shape" cx="81" cy="81" rx="17" ry="13" fill="#dba4b9" transform="rotate(-45 81 81)"/>
        <ellipse class="petal-shape" cx="81" cy="39" rx="17" ry="13" fill="#dba4b9" transform="rotate(45 81 39)"/>
        <ellipse class="petal-shape" cx="39" cy="81" rx="17" ry="13" fill="#dba4b9" transform="rotate(45 39 81)"/>
        <circle cx="60" cy="60" r="13" fill="#c8a15f"/>
      </g>
    </svg>
  </button>
  <div>
    <button id="celebrate-btn">celebrate</button>
  </div>
</section>

<footer>Created by your Lovey</footer>

<script>
  const field = document.getElementById('petal-field');
  const petalCount = window.innerWidth < 600 ? 10 : 18;
  for(let i=0;i<petalCount;i++){
    const p = document.createElement('div');
    p.className='petal';
    p.style.left = Math.random()*100+'vw';
    p.style.setProperty('--drift', (Math.random()*140-70)+'px');
    const duration = 11+Math.random()*10;
    p.style.animationDuration = duration+'s';
    p.style.animationDelay = (Math.random()*duration)+'s';
    p.style.opacity = 0.2+Math.random()*0.3;
    p.style.transform = `scale(${0.6+Math.random()*0.8})`;
    field.appendChild(p);
  }

  document.querySelectorAll('.frame input[type=file]').forEach(input=>{
    input.addEventListener('change', e=>{
      const file = e.target.files[0];
      if(!file) return;
      const url = URL.createObjectURL(file);
      const frame = input.closest('.frame');
      frame.querySelector('.plus')?.remove();
      const img = document.createElement('img');
      img.src = url;
      img.alt = 'uploaded photo';
      frame.insertBefore(img, input);
    });
  });

  const envelope = document.getElementById('envelope');
  const letterPaper = document.getElementById('letterPaper');
  const envelopeFace = document.getElementById('envelopeFace');
  function openLetter(){
    const isOpen = letterPaper.classList.toggle('open');
    envelope.setAttribute('aria-expanded', isOpen);
    envelopeFace.querySelector('.cue').textContent = isOpen ? 'close' : 'open';
  }
  envelope.addEventListener('click', openLetter);
  envelope.addEventListener('keydown', e=>{
    if(e.key==='Enter' || e.key===' '){ e.preventDefault(); openLetter(); }
  });

  const candleBtn = document.getElementById('candle-btn');
  const wishCue = document.getElementById('wishCue');
  const wishForm = document.getElementById('wishForm');
  const wishText = document.getElementById('wishText');
  const wishKept = document.getElementById('wishKept');
  const wishKeptText = document.getElementById('wishKeptText');

  candleBtn.addEventListener('click', ()=>{
    if(candleBtn.classList.contains('blown')) return;
    candleBtn.classList.add('blown');
    wishCue.textContent = 'now write it down';
    wishForm.classList.add('show');
    wishText.focus();
  });

  wishForm.addEventListener('submit', e=>{
    e.preventDefault();
    const value = wishText.value.trim();
    if(!value) return;
    wishKeptText.textContent = value;
    wishForm.classList.remove('show');
    wishKept.classList.add('show');
    wishCue.textContent = 'wish made';
  });

  const flowerBtn = document.getElementById('flower-btn');
  flowerBtn.addEventListener('click', ()=> flowerBtn.classList.toggle('bloomed'));

  const celebrateBtn = document.getElementById('celebrate-btn');
  const heartChars = ['🩷','🌸','✦'];
  celebrateBtn.addEventListener('click', ()=>{
    for(let i=0;i<16;i++){
      const h = document.createElement('div');
      h.className='heart-pop';
      h.textContent = heartChars[Math.floor(Math.random()*heartChars.length)];
      h.style.left = (Math.random()*100)+'vw';
      h.style.bottom = '0px';
      h.style.animationDelay = (Math.random()*0.4)+'s';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), 2400);
    }
  });
</script>

</body>
</html>
